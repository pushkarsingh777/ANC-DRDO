# Causal Conv-TasNet Training Configuration — FR-2 (Model Training)

seed: 1337
device: "cuda"          # "cuda" or "cpu"

paths:
  manifests_dir: "../anc-dataset-pipeline/data/manifests"
  checkpoints_dir: "checkpoints"
  logs_dir: "runs"

data:
  sample_rate: 16000
  segment_length_s: 2.0     # 2.0s = 32,000 samples per training crop
  batch_size: 4            # optimal for 4GB RTX 2050 with AMP
  eval_batch_size: 1
  num_workers: 0           # 0 avoids Windows multiprocessing overhead
  pin_memory: true

model:
  # Causal Conv-TasNet parameters
  n_filters: 256           # N: encoder/decoder feature dimension
  encoder_kernel_size: 32  # L: 32 samples = 2ms window at 16kHz
  encoder_stride: 16       # L/2: 16 samples = 1ms stride (hop)
  tcn_channels: 128        # B: bottleneck channels in TCN
  tcn_hidden_channels: 512 # H: depthwise conv expansion channels
  kernel_size: 3           # P: TCN kernel size
  n_blocks_per_repeat: 8   # X: dilations 2^0 ... 2^7
  n_repeats: 3             # R: number of TCN repeats (3 * 8 = 24 layers)
  causal: true             # Strictly causal (zero lookahead)
  norm_type: "ChLN"        # Channel LayerNorm (low VRAM, strictly causal)

training:
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.00001
  grad_clip_norm: 5.0
  use_amp: true            # Automatic Mixed Precision (FP16)
  
  # Learning rate scheduler
  scheduler: "plateau"     # "plateau" or "cosine"
  scheduler_patience: 3
  scheduler_factor: 0.5
  min_lr: 0.000001
  
  # Loss weighting
  si_snr_weight: 1.0
  stft_weight: 0.0         # Set > 0 if multi-resolution spectral loss is desired

evaluation:
  compute_pesq: true
  compute_stoi: true
