# Dataset generation config — FR-1 (Dataset Pipeline)
# Edit paths once real corpora are downloaded (see scripts/download_data.py)

seed: 1337
sample_rate: 16000

paths:
  clean_speech_dir: data/clean_speech
  noise_root_dir: data/noise          # expects subfolders: impulsive/ rotor/ vehicle/ ambient/ sirens/
  manifests_dir: data/manifests
  mixtures_dir: data/mixtures

split:
  train: 0.8
  val: 0.1
  test: 0.1

mixing:
  snr_db_min: -10.0
  snr_db_max: 15.0
  # relative sampling weight per noise category (must sum to 1.0, or will be normalized)
  noise_category_weights:
    stationary_like:      # ambient, vehicle hum
      categories: [ambient, vehicle]
      weight: 0.35
    non_stationary:       # sirens, changing rpm
      categories: [sirens, vehicle]
      weight: 0.25
    rotor:
      categories: [rotor]
      weight: 0.20
    impulsive:
      categories: [impulsive]
      weight: 0.20
  # probability an additional short impulsive burst (gunshot/explosion) is layered
  # on top of the primary noise bed, independent of the category above
  impulsive_overlay_prob: 0.3
  impulsive_overlay_count_range: [1, 3]

augmentation:
  reverb:
    prob: 0.3
    rt60_range_s: [0.15, 0.6]
  clipping:
    prob: 0.1
    clip_threshold_range: [0.7, 0.95]   # fraction of full scale
  speed_perturbation:
    prob: 0.3
    rate_range: [0.9, 1.1]

output:
  audio_format: wav
  subtype: PCM_16
  write_noise_only_reference: true   # also save the isolated noise (for ref-mic simulation)
